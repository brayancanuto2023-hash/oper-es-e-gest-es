<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Ultra 4K Rio - Gestão & Inteligência</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Compiler CDN -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    .chrome-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(203, 213, 225, 0.2);
      backdrop-filter: blur(16px);
    }
    .chrome-card:hover {
      border-color: rgba(241, 245, 249, 0.4);
    }
    .silver-gradient-text {
      background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 50%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-slate-200 selection:text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const CIDADES_BAIRROS = {
      'Macaé': ['Cavaleiros', 'Imbetiba', 'Centro', 'Novo Cavaleiros', 'Praia Campista', 'Riviera Fluminense', 'Parque Aeroporto', 'Glória', 'Granja dos Cavaleiros', 'Visconde de Araújo'],
      'Rio de Janeiro (Capital)': ['Barra da Tijuca', 'Copacabana', 'Ipanema', 'Centro', 'Botafogo', 'Leblon', 'Tijuca', 'Recreio dos Bandeirantes'],
      'Niterói': ['Icaraí', 'Centro', 'Ingá', 'Santa Rosa', 'Piratininga', 'Itaipu'],
      'Cabo Frio': ['Praia do Forte', 'Passagem', 'Centro', 'Braga', 'São Cristóvão'],
      'Campos dos Goytacazes': ['Pelinca', 'Centro', 'Flamboyant', 'Parque Tamandaré', 'Turf Club'],
      'Petrópolis': ['Itaipava', 'Centro Histórico', 'Valparaíso', 'Corrêas', 'Bingen']
    };

    const COMERCIOS_INICIAIS = [
      { id: 'biz-1', name: 'Supermercado Serra-Mar', city: 'Macaé', bairro: 'Cavaleiros', category: 'Mercado / Supermercado', address: 'Av. Atlântica, 1420 - Cavaleiros, Macaé - RJ, 27920-390', phone: '+55 (22) 2772-1010', contactPerson: 'Roberto Silva (Gerente)', status: 'Prospecção', notes: 'Interessado em automação financeira e gestão de estoque.' },
      { id: 'biz-2', name: 'Mac Offshore Energy Supply', city: 'Macaé', bairro: 'Novo Cavaleiros', category: 'Indústria / Offshore', address: 'R. Luiz Carlos de Alencar, 88 - Novo Cavaleiros, Macaé - RJ, 27930-080', phone: '+55 (22) 2772-9090', contactPerson: 'Eng. Carlos Eduardo', status: 'Cliente Ativo', notes: 'Contrato de gestão operacional renovado para 2027.' },
      { id: 'biz-3', name: 'Farmácia & Drogaria Atlântica', city: 'Macaé', bairro: 'Imbetiba', category: 'Farmácia / Saúde', address: 'Av. Elias Agostinho, 210 - Imbetiba, Macaé - RJ, 27913-350', phone: '+55 (22) 2762-3000', contactPerson: 'Dra. Vanessa Lima', status: 'Contatado', notes: 'Aguardando apresentação do painel 4K.' },
      { id: 'biz-4', name: 'Restaurante e Churrascaria Miramar', city: 'Macaé', bairro: 'Praia Campista', category: 'Restaurante / Alimentação', address: 'Av. Geraldo Nogueira da Silva, 450 - Praia Campista, Macaé - RJ', phone: '+55 (22) 2773-5500', contactPerson: 'Chef Marcos', status: 'Prospecção', notes: 'Possui 3 unidades no RJ.' },
      { id: 'biz-5', name: 'Mega Store Eletro & Utilidades', city: 'Macaé', bairro: 'Centro', category: 'Loja / Varejo', address: 'Rua Silva Jardim, 300 - Centro, Macaé - RJ', phone: '+55 (22) 2772-4411', contactPerson: 'Amanda Castro', status: 'Sem Contato', notes: 'Visita agendada para próxima semana.' },
      { id: 'biz-6', name: 'Boutique Icaraí Platinum', city: 'Niterói', bairro: 'Icaraí', category: 'Loja / Varejo', address: 'Rua Ator Paulo Gustavo, 240 - Icaraí, Niterói - RJ', phone: '+55 (21) 2610-9900', contactPerson: 'Luciana Mello', status: 'Cliente Ativo', notes: 'Loja de artigos de luxo.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('radar');
      const [selectedCity, setSelectedCity] = useState('Macaé');
      const [selectedBairro, setSelectedBairro] = useState('Todos');
      
      const [toastMessage, setToastMessage] = useState(null);
      const [isClientPortalGenerated, setIsClientPortalGenerated] = useState(false);
      
      const [businesses, setBusinesses] = useState(COMERCIOS_INICIAIS);
      const [finances, setFinances] = useState([
        { id: 'trx-1', description: 'Licenciamento Sistema Macaé Subsea', amount: 15400.00, type: 'Entrada', category: 'Contrato', city: 'Macaé', date: '2026-10-24' },
        { id: 'trx-2', description: 'Servidor Nuvem 4K & CDN Infra', amount: 1200.00, type: 'Saída', category: 'Infraestrutura', city: 'Rio de Janeiro', date: '2026-10-25' }
      ]);
      const [crmLeads, setCrmLeads] = useState([
        { id: 'lead-1', name: 'Logística Portuária Imbetiba', city: 'Macaé', bairro: 'Imbetiba', value: 450000, stage: 'Negociação Final', rating: 5, responsible: 'Gabriel Santos', phone: '+55 (22) 2772-8833', notes: 'Decisão do conselho agendada.' },
        { id: 'lead-2', name: 'Rede de Hotéis Orla Cavaleiros', city: 'Macaé', bairro: 'Cavaleiros', value: 180000, stage: 'Proposta Enviada', rating: 4, responsible: 'Mariana Costa', phone: '+55 (22) 2772-1122', notes: 'Aguardando validação do setor de TI.' }
      ]);

      const [radarCategoryFilter, setRadarCategoryFilter] = useState('Todas');
      const [radarSearchTerm, setRadarSearchTerm] = useState('');

      const [activeModal, setActiveModal] = useState(null);
      const [modalData, setModalData] = useState({});
      const [itemToDelete, setItemToDelete] = useState(null);

      const [instaPosts, setInstaPosts] = useState([
        { id: 1, likes: 2450, comments: 189, caption: 'Radar de negócios em Macaé expandido! Cobertura completa no bairro Cavaleiros e Imbetiba. ⚡️', time: '2 horas atrás' }
      ]);
      const [newPostCaption, setNewPostCaption] = useState('');

      const [chatMessages, setChatMessages] = useState([
        { sender: 'system', text: 'Central de Suporte Rio Ultra 4K pronta. Como podemos auxiliar nas operações hoje?' }
      ]);
      const [chatInput, setChatInput] = useState('');

      const [systemSettings, setSystemSettings] = useState({
        whatsappApi: '+552227729000',
        googleMapsKey: 'AIzaSy_RIO_MAPS_4K_VERIFIED'
      });

      const canvasRef = useRef(null);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = Array.from({ length: 40 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2 + 0.5,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.5 + 0.2
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          const grad = ctx.createLinearGradient(0, 0, width, height);
          grad.addColorStop(0, 'rgba(15, 23, 42, 0.95)');
          grad.addColorStop(0.5, 'rgba(30, 41, 59, 0.85)');
          grad.addColorStop(1, 'rgba(2, 6, 23, 0.98)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(226, 232, 240, ${p.alpha})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#e2e8f0';
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const openGoogleMaps = (address, city) => {
        const query = encodeURIComponent(`${address}, ${city}, RJ, Brasil`);
        window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
      };

      const totalIncome = finances.filter(f => f.type === 'Entrada').reduce((acc, curr) => acc + curr.amount, 0);
      const totalExpenses = finances.filter(f => f.type === 'Saída').reduce((acc, curr) => acc + curr.amount, 0);
      const netBalance = totalIncome - totalExpenses;

      const filteredBusinesses = businesses.filter(b => {
        const matchCity = selectedCity === 'Todas' || b.city === selectedCity;
        const matchBairro = selectedBairro === 'Todos' || b.bairro === selectedBairro;
        const matchCategory = radarCategoryFilter === 'Todas' || b.category === radarCategoryFilter;
        const matchSearch = radarSearchTerm === '' || 
          b.name.toLowerCase().includes(radarSearchTerm.toLowerCase()) ||
          b.address.toLowerCase().includes(radarSearchTerm.toLowerCase()) ||
          b.contactPerson.toLowerCase().includes(radarSearchTerm.toLowerCase());
        return matchCity && matchBairro && matchCategory && matchSearch;
      });

      const handleSaveBusiness = (e) => {
        e.preventDefault();
        if (modalData.id) {
          setBusinesses(businesses.map(b => b.id === modalData.id ? modalData : b));
          showToast('Empresa/Comércio atualizado!');
        } else {
          const newBiz = { ...modalData, id: `biz-${Date.now()}` };
          setBusinesses([newBiz, ...businesses]);
          showToast('Nova empresa adicionada ao Radar!');
        }
        setActiveModal(null);
      };

      const handleSaveFinance = (e) => {
        e.preventDefault();
        const newFin = {
          id: `trx-${Date.now()}`,
          description: modalData.description,
          amount: parseFloat(modalData.amount) || 0,
          type: modalData.type || 'Entrada',
          category: modalData.category || 'Geral',
          city: modalData.city || 'Macaé',
          date: new Date().toISOString().split('T')[0]
        };
        setFinances([newFin, ...finances]);
        showToast('Lançamento registrado com sucesso!');
        setActiveModal(null);
      };

      const handleSaveLead = (e) => {
        e.preventDefault();
        if (modalData.id) {
          setCrmLeads(crmLeads.map(l => l.id === modalData.id ? modalData : l));
          showToast('Lead atualizado!');
        } else {
          const newLead = {
            ...modalData,
            id: `lead-${Date.now()}`,
            value: parseFloat(modalData.value) || 0,
            rating: parseInt(modalData.rating) || 5
          };
          setCrmLeads([newLead, ...crmLeads]);
          showToast('Novo Lead cadastrado!');
        }
        setActiveModal(null);
      };

      const confirmDelete = () => {
        if (!itemToDelete) return;
        if (itemToDelete.type === 'business') {
          setBusinesses(businesses.filter(b => b.id !== itemToDelete.id));
          showToast('Empresa removida.');
        } else if (itemToDelete.type === 'finance') {
          setFinances(finances.filter(f => f.id !== itemToDelete.id));
          showToast('Transação excluída.');
        } else if (itemToDelete.type === 'lead') {
          setCrmLeads(crmLeads.filter(l => l.id !== itemToDelete.id));
          showToast('Lead excluído.');
        }
        setItemToDelete(null);
      };

      return (
        <div className="relative min-h-screen flex flex-col md:flex-row overflow-hidden">
          <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />

          {toastMessage && (
            <div className="fixed top-6 right-6 z-50 chrome-card px-6 py-4 rounded-xl shadow-2xl border-l-4 border-slate-100 text-slate-100 flex items-center gap-3">
              <i data-lucide="check-circle-2" className="text-emerald-400 w-6 h-6"></i>
              <span className="font-semibold text-sm">{toastMessage}</span>
            </div>
          )}

          {/* BARRA LATERAL */}
          <aside className="w-full md:w-80 chrome-card z-20 flex flex-col justify-between border-r border-slate-700/50 p-5">
            <div>
              <div className="flex items-center gap-3 pb-6 mb-6 border-b border-slate-700/60">
                <div className="p-3 bg-gradient-to-tr from-slate-200 to-slate-400 rounded-2xl shadow-lg text-slate-950 font-black text-xl">
                  4K
                </div>
                <div>
                  <h1 className="font-extrabold text-lg silver-gradient-text uppercase">Rio Subsea</h1>
                  <p className="text-xs text-slate-400 flex items-center gap-1 font-medium">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Macaé & Região RJ
                  </p>
                </div>
              </div>

              {/* FILTROS DE LOCALIZAÇÃO */}
              <div className="mb-6 p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                <label className="text-[11px] font-bold text-slate-400 uppercase block mb-1">Município</label>
                <select 
                  value={selectedCity} 
                  onChange={(e) => {
                    setSelectedCity(e.target.value);
                    setSelectedBairro('Todos');
                  }}
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-semibold text-slate-200"
                >
                  {Object.keys(CIDADES_BAIRROS).map(cidade => (
                    <option key={cidade} value={cidade}>{cidade}</option>
                  ))}
                </select>

                <label className="text-[11px] font-bold text-slate-400 uppercase block mt-3 mb-1">Bairro Específico</label>
                <select 
                  value={selectedBairro} 
                  onChange={(e) => setSelectedBairro(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-semibold text-slate-200"
                >
                  <option value="Todos">Todos os Bairros</option>
                  {CIDADES_BAIRROS[selectedCity]?.map(bairro => (
                    <option key={bairro} value={bairro}>{bairro}</option>
                  ))}
                </select>
              </div>

              {/* MENU DE ABAS */}
              <nav className="space-y-2">
                {[
                  { id: 'radar', label: 'Radar Comercial RJ', icon: 'map-pin' },
                  { id: 'finance', label: 'Painel Financeiro', icon: 'dollar-sign' },
                  { id: 'sales', label: 'CRM & Vendas', icon: 'trending-up' },
                  { id: 'instagram', label: 'Instagram Suite', icon: 'instagram' },
                  { id: 'settings', label: 'Configurações', icon: 'settings' },
                  { id: 'support', label: 'Suporte VIP 24/7', icon: 'headphones' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold transition ${
                      activeTab === item.id 
                        ? 'bg-gradient-to-r from-slate-100 to-slate-300 text-slate-950 font-bold' 
                        : 'text-slate-300 hover:bg-slate-800/60'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide={item.icon} className="w-5 h-5"></i>
                      <span>{item.label}</span>
                    </div>
                  </button>
                ))}
              </nav>
            </div>

            <div className="pt-6 border-t border-slate-800">
              <button
                onClick={() => {
                  setIsClientPortalGenerated(true);
                  showToast('Portal 360° do Cliente Gerado!');
                }}
                className="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-slate-200 via-white to-slate-300 text-slate-950 font-black text-xs uppercase tracking-widest shadow-xl hover:scale-[1.02] transition border border-white flex items-center justify-center gap-2"
              >
                <i data-lucide="zap" className="w-4 h-4 fill-slate-950"></i>
                Gerar Sistema Cliente
              </button>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL */}
          <main className="flex-1 z-10 p-4 md:p-8 overflow-y-auto max-h-screen custom-scrollbar">
            
            <header className="chrome-card rounded-2xl p-5 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <h2 className="text-2xl font-black silver-gradient-text uppercase">
                  {activeTab === 'radar' && 'Mapeamento Comercial & Empresas RJ'}
                  {activeTab === 'finance' && 'Painel de Controle Financeiro'}
                  {activeTab === 'sales' && 'Gestão de Vendas & Negociações'}
                  {activeTab === 'instagram' && 'Instagram & Redes Sociais'}
                  {activeTab === 'settings' && 'Configurações Avançadas'}
                  {activeTab === 'support' && 'Central de Suporte Operacional'}
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  Localização Selecionada: <span className="text-slate-200 font-bold">{selectedCity}</span> 
                  {selectedBairro !== 'Todos' && ` → ${selectedBairro}`}
                </p>
              </div>

              <div className="px-4 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-xs font-mono text-slate-300">
                <span className="text-emerald-400 font-bold">● ONLINE</span> | 4K Ultra
              </div>
            </header>

            {/* RADAR COMERCIAL */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                <div className="chrome-card p-5 rounded-2xl flex flex-col lg:flex-row gap-4 items-center justify-between">
                  <div className="flex flex-1 gap-3 w-full">
                    <input 
                      type="text" 
                      placeholder="Buscar empresa, comércio, mercado em Macaé/RJ..." 
                      value={radarSearchTerm}
                      onChange={(e) => setRadarSearchTerm(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none"
                    />
                    <select
                      value={radarCategoryFilter}
                      onChange={(e) => setRadarCategoryFilter(e.target.value)}
                      className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none"
                    >
                      <option value="Todas">Todas Categoria</option>
                      <option value="Mercado / Supermercado">Mercado / Supermercado</option>
                      <option value="Indústria / Offshore">Indústria / Offshore</option>
                      <option value="Farmácia / Saúde">Farmácia / Saúde</option>
                      <option value="Restaurante / Alimentação">Restaurante / Alimentação</option>
                      <option value="Loja / Varejo">Loja / Varejo</option>
                    </select>
                  </div>
                  <button
                    onClick={() => {
                      setModalData({ name: '', city: selectedCity, bairro: selectedBairro !== 'Todos' ? selectedBairro : 'Cavaleiros', category: 'Mercado / Supermercado', address: '', phone: '', contactPerson: '', status: 'Prospecção', notes: '' });
                      setActiveModal('add_biz');
                    }}
                    className="w-full lg:w-auto px-5 py-2.5 rounded-xl bg-slate-100 text-slate-950 font-bold text-xs uppercase tracking-wider hover:bg-white transition flex items-center justify-center gap-2"
                  >
                    <i data-lucide="plus-circle" className="w-4 h-4"></i>
                    Cadastrar Empresa
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredBusinesses.map(biz => (
                    <div key={biz.id} className="chrome-card p-6 rounded-2xl flex flex-col justify-between">
                      <div>
                        <div className="flex items-start justify-between gap-2 mb-3">
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-black uppercase bg-slate-800 text-slate-300 border border-slate-700">
                            {biz.category}
                          </span>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                            biz.status === 'Cliente Ativo' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'
                          }`}>
                            {biz.status}
                          </span>
                        </div>

                        <h3 className="text-lg font-bold text-white mb-2">{biz.name}</h3>

                        <div className="space-y-2 text-xs text-slate-300 mb-4">
                          <p className="flex items-start gap-2">
                            <i data-lucide="map-pin" className="w-4 h-4 text-slate-400 shrink-0 mt-0.5"></i>
                            <span>{biz.address}</span>
                          </p>
                          <p className="flex items-center gap-2">
                            <i data-lucide="phone" className="w-4 h-4 text-slate-400 shrink-0"></i>
                            <span>{biz.phone}</span>
                          </p>
                          <p className="flex items-center gap-2">
                            <i data-lucide="user" className="w-4 h-4 text-slate-400 shrink-0"></i>
                            <span>Contato: <strong>{biz.contactPerson}</strong></span>
                          </p>
                        </div>
                      </div>

                      <div className="pt-4 border-t border-slate-800 flex items-center justify-between gap-2">
                        <button
                          onClick={() => openGoogleMaps(biz.address, biz.city)}
                          className="flex-1 py-2 px-3 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold flex items-center justify-center gap-1.5 transition"
                        >
                          <i data-lucide="compass" className="w-3.5 h-3.5 text-sky-400"></i>
                          Google Maps
                        </button>
                        <button
                          onClick={() => {
                            setModalData(biz);
                            setActiveModal('edit_biz');
                          }}
                          className="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 transition"
                        >
                          <i data-lucide="edit-3" className="w-4 h-4"></i>
                        </button>
                        <button
                          onClick={() => setItemToDelete({ id: biz.id, type: 'business', name: biz.name })}
                          className="p-2 rounded-lg bg-red-950/40 hover:bg-red-900/60 text-red-400 transition border border-red-900/40"
                        >
                          <i data-lucide="trash-2" className="w-4 h-4"></i>
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* FINANCEIRO */}
            {activeTab === 'finance' && (
              <div className="space-y-6">
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="chrome-card p-6 rounded-2xl">
                    <p className="text-xs font-bold uppercase text-slate-400 mb-1">Saldo Líquido</p>
                    <h3 className={`text-3xl font-black ${netBalance >= 0 ? 'text-emerald-400' : 'text-red-400'}`}>
                      R$ {netBalance.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </h3>
                  </div>
                  <div className="chrome-card p-6 rounded-2xl">
                    <p className="text-xs font-bold uppercase text-slate-400 mb-1">Entradas</p>
                    <h3 className="text-3xl font-black text-slate-100">
                      R$ {totalIncome.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </h3>
                  </div>
                  <div className="chrome-card p-6 rounded-2xl">
                    <p className="text-xs font-bold uppercase text-slate-400 mb-1">Saídas</p>
                    <h3 className="text-3xl font-black text-slate-400">
                      R$ {totalExpenses.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                    </h3>
                  </div>
                </div>

                <div className="chrome-card p-6 rounded-2xl">
                  <div className="flex items-center justify-between mb-6">
                    <h3 className="text-lg font-bold text-slate-100 uppercase">Lançamentos Financeiros</h3>
                    <button
                      onClick={() => {
                        setModalData({ description: '', amount: '', type: 'Entrada', category: 'Serviço', city: selectedCity });
                        setActiveModal('add_fin');
                      }}
                      className="px-4 py-2 rounded-xl bg-slate-100 text-slate-950 font-bold text-xs uppercase"
                    >
                      + Novo Lançamento
                    </button>
                  </div>

                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs text-slate-300">
                      <thead className="bg-slate-900/80 uppercase text-[10px] text-slate-400">
                        <tr>
                          <th className="p-3">Descrição</th>
                          <th className="p-3">Tipo</th>
                          <th className="p-3">Data</th>
                          <th className="p-3 text-right">Valor</th>
                          <th className="p-3 text-center">Ação</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-800/60">
                        {finances.map(item => (
                          <tr key={item.id} className="hover:bg-slate-800/40">
                            <td className="p-3 font-semibold text-slate-100">{item.description}</td>
                            <td className="p-3">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold ${
                                item.type === 'Entrada' ? 'bg-emerald-950 text-emerald-400' : 'bg-red-950 text-red-400'
                              }`}>
                                {item.type}
                              </span>
                            </td>
                            <td className="p-3 font-mono">{item.date}</td>
                            <td className={`p-3 text-right font-bold ${item.type === 'Entrada' ? 'text-emerald-400' : 'text-slate-300'}`}>
                              R$ {item.amount.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                            </td>
                            <td className="p-3 text-center">
                              <button
                                onClick={() => setItemToDelete({ id: item.id, type: 'finance', name: item.description })}
                                className="p-1.5 rounded bg-red-950/40 text-red-400 hover:bg-red-900/60 transition"
                              >
                                <i data-lucide="trash-2" className="w-3.5 h-3.5"></i>
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            )}

            {/* CRM VENDAS */}
            {activeTab === 'sales' && (
              <div className="space-y-6">
                <div className="chrome-card p-5 rounded-2xl flex items-center justify-between">
                  <h3 className="text-lg font-bold text-slate-100 uppercase">Gestão de Vendas RJ</h3>
                  <button
                    onClick={() => {
                      setModalData({ name: '', city: selectedCity, bairro: selectedBairro !== 'Todos' ? selectedBairro : 'Cavaleiros', value: '', stage: 'Proposta Enviada', rating: 5, responsible: '', phone: '', notes: '' });
                      setActiveModal('add_lead');
                    }}
                    className="px-4 py-2 rounded-xl bg-slate-100 text-slate-950 font-bold text-xs uppercase"
                  >
                    + Adicionar Lead
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {crmLeads.map(lead => (
                    <div key={lead.id} className="chrome-card p-6 rounded-2xl flex flex-col justify-between">
                      <div>
                        <div className="flex items-center justify-between mb-3">
                          <span className="px-2.5 py-0.5 rounded text-[10px] font-bold uppercase bg-slate-800 text-slate-200">
                            {lead.stage}
                          </span>
                          <div className="flex text-amber-400">
                            {[...Array(5)].map((_, i) => (
                              <i data-lucide="star" key={i} className={`w-3.5 h-3.5 ${i < lead.rating ? 'fill-amber-400' : 'text-slate-700'}`}></i>
                            ))}
                          </div>
                        </div>

                        <h4 className="text-lg font-bold text-slate-100 mb-1">{lead.name}</h4>
                        <p className="text-xs text-slate-400 mb-4">{lead.city} - {lead.bairro}</p>

                        <p className="text-xl font-black text-emerald-400 font-mono mb-4">
                          R$ {lead.value.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}
                        </p>
                      </div>

                      <div className="pt-4 border-t border-slate-800 flex items-center justify-end gap-2">
                        <button
                          onClick={() => {
                            setModalData(lead);
                            setActiveModal('edit_lead');
                          }}
                          className="px-3 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs font-semibold"
                        >
                          Editar
                        </button>
                        <button
                          onClick={() => setItemToDelete({ id: lead.id, type: 'lead', name: lead.name })}
                          className="px-3 py-1.5 rounded-lg bg-red-950/40 text-red-400 text-xs font-semibold"
                        >
                          Excluir
                        </button>
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* INSTAGRAM */}
            {activeTab === 'instagram' && (
              <div className="space-y-6">
                <div className="chrome-card p-6 rounded-2xl">
                  <h3 className="text-lg font-bold text-slate-100 uppercase mb-4">Novo Post Simulado</h3>
                  <textarea
                    rows="3"
                    value={newPostCaption}
                    onChange={(e) => setNewPostCaption(e.target.value)}
                    placeholder="Legenda para as redes sociais..."
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-slate-200 focus:outline-none mb-3"
                  ></textarea>
                  <button
                    onClick={() => {
                      if (!newPostCaption) return;
                      setInstaPosts([{ id: Date.now(), likes: 1, comments: 0, caption: newPostCaption, time: 'Agora mesmo' }, ...instaPosts]);
                      setNewPostCaption('');
                      showToast('Post publicado!');
                    }}
                    className="px-5 py-2.5 rounded-xl bg-slate-100 text-slate-950 font-bold text-xs uppercase"
                  >
                    Publicar
                  </button>
                </div>

                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  {instaPosts.map(post => (
                    <div key={post.id} className="chrome-card p-6 rounded-2xl space-y-3">
                      <p className="font-bold text-sm text-slate-100">riosubsea_oficial</p>
                      <p className="text-xs text-slate-300">{post.caption}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* CONFIGURAÇÕES */}
            {activeTab === 'settings' && (
              <div className="chrome-card p-6 rounded-2xl space-y-4 max-w-2xl">
                <h3 className="text-lg font-bold text-slate-100 uppercase border-b border-slate-800 pb-3">Configurações do Sistema</h3>
                <div>
                  <label className="block text-slate-400 font-bold text-xs mb-1">WhatsApp da Empresa</label>
                  <input 
                    type="text" 
                    value={systemSettings.whatsappApi} 
                    onChange={(e) => setSystemSettings({ ...systemSettings, whatsappApi: e.target.value })}
                    className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2 text-xs text-slate-200"
                  />
                </div>
              </div>
            )}

            {/* SUPORTE */}
            {activeTab === 'support' && (
              <div className="chrome-card p-6 rounded-2xl max-w-xl mx-auto flex flex-col h-[400px]">
                <h3 className="text-lg font-bold text-slate-100 uppercase mb-4 pb-2 border-b border-slate-800">Suporte 24/7</h3>
                <div className="flex-1 overflow-y-auto space-y-3 p-3 bg-slate-950/60 rounded-xl mb-4 custom-scrollbar">
                  {chatMessages.map((msg, i) => (
                    <div key={i} className={`flex ${msg.sender === 'user' ? 'justify-end' : 'justify-start'}`}>
                      <div className={`p-3 rounded-2xl text-xs max-w-[80%] ${msg.sender === 'user' ? 'bg-slate-200 text-slate-950 font-bold' : 'bg-slate-800 text-slate-200'}`}>
                        {msg.text}
                      </div>
                    </div>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input 
                    type="text" 
                    value={chatInput} 
                    onChange={(e) => setChatInput(e.target.value)}
                    placeholder="Sua mensagem..."
                    className="flex-1 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-200"
                  />
                  <button 
                    onClick={() => {
                      if (!chatInput) return;
                      setChatMessages([...chatMessages, { sender: 'user', text: chatInput }]);
                      setChatInput('');
                    }}
                    className="px-4 py-2 bg-slate-100 text-slate-950 font-bold text-xs rounded-xl"
                  >
                    Enviar
                  </button>
                </div>
              </div>
            )}

          </main>

          {/* OVERLAY PORTAL CLIENTE */}
          {isClientPortalGenerated && (
            <div className="fixed inset-0 z-50 bg-slate-950/95 backdrop-blur-2xl p-6 overflow-y-auto">
              <div className="max-w-5xl mx-auto space-y-6">
                <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                  <h2 className="text-2xl font-black text-white">Portal do Cliente 360° Exclusivo</h2>
                  <button onClick={() => setIsClientPortalGenerated(false)} className="px-4 py-2 bg-slate-800 text-slate-200 rounded-xl text-xs font-bold">Fechar</button>
                </div>
                <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                  <div className="chrome-card p-6 rounded-2xl">
                    <p className="text-xs text-slate-400 font-bold">Status do Serviço</p>
                    <p className="text-xl font-bold text-emerald-400">100% Operacional</p>
                  </div>
                  <div className="chrome-card p-6 rounded-2xl">
                    <p className="text-xs text-slate-400 font-bold">Documentos</p>
                    <p className="text-xl font-bold text-slate-100">12 Relatórios</p>
                  </div>
                  <div className="chrome-card p-6 rounded-2xl">
                    <p className="text-xs text-slate-400 font-bold">Atendimento VIP</p>
                    <p className="text-xl font-bold text-sky-400">Macaé Matriz</p>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* MODAL EMPRESA */}
          {(activeModal === 'add_biz' || activeModal === 'edit_biz') && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="chrome-card w-full max-w-md p-6 rounded-2xl space-y-3">
                <h3 className="text-lg font-bold text-slate-100 uppercase">Cadastrar / Editar Empresa</h3>
                <form onSubmit={handleSaveBusiness} className="space-y-3 text-xs">
                  <input type="text" placeholder="Nome" required value={modalData.name || ''} onChange={(e) => setModalData({ ...modalData, name: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  <input type="text" placeholder="Endereço" required value={modalData.address || ''} onChange={(e) => setModalData({ ...modalData, address: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  <input type="text" placeholder="Telefone" required value={modalData.phone || ''} onChange={(e) => setModalData({ ...modalData, phone: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-slate-100 text-slate-950 rounded-xl font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL FINANCEIRO */}
          {activeModal === 'add_fin' && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="chrome-card w-full max-w-sm p-6 rounded-2xl space-y-3">
                <h3 className="text-lg font-bold text-slate-100 uppercase">Novo Lançamento</h3>
                <form onSubmit={handleSaveFinance} className="space-y-3 text-xs">
                  <input type="text" placeholder="Descrição" required value={modalData.description || ''} onChange={(e) => setModalData({ ...modalData, description: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  <input type="number" step="0.01" placeholder="Valor (R$)" required value={modalData.amount || ''} onChange={(e) => setModalData({ ...modalData, amount: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200" />
                  <select value={modalData.type || 'Entrada'} onChange={(e) => setModalData({ ...modalData, type: e.target.value })} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-slate-200">
                    <option value="Entrada">Entrada (+)</option>
                    <option value="Saída">Saída (-)</option>
                  </select>
                  <div className="flex justify-end gap-2 pt-2">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 bg-slate-100 text-slate-950 rounded-xl font-bold">Salvar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* EXCLUSÃO */}
          {itemToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="chrome-card w-full max-w-xs p-6 rounded-2xl space-y-3 text-center">
                <h3 className="text-lg font-bold text-slate-100">Excluir Item?</h3>
                <p className="text-xs text-slate-300">Deseja apagar <strong>"{itemToDelete.name}"</strong>?</p>
                <div className="flex justify-center gap-2 pt-2">
                  <button onClick={() => setItemToDelete(null)} className="px-4 py-2 bg-slate-800 text-slate-300 rounded-xl font-bold text-xs">Cancelar</button>
                  <button onClick={confirmDelete} className="px-4 py-2 bg-red-600 text-white rounded-xl font-bold text-xs">Excluir</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 400);
  </script>
</body>
</html>
