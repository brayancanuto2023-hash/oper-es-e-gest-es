<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel Ultra 4K Rio - Gestão & Inteligência</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  
  <!-- Babel Compiler -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(226, 232, 240, 0.2); }
      50% { box-shadow: 0 0 35px rgba(255, 255, 255, 0.4); }
    }
    .chrome-card {
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
      border: 1px solid rgba(203, 213, 225, 0.2);
      backdrop-filter: blur(16px);
    }
    .chrome-card:hover {
      border-color: rgba(241, 245, 249, 0.4);
    }
    .silver-gradient-text {
      background: linear-gradient(180deg, #FFFFFF 0%, #CBD5E1 50%, #94A3B8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #475569;
      border-radius: 4px;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-slate-200 selection:text-slate-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // BANCO DE DADOS INICIAL - MUNICÍPIOS E BAIRROS DO RJ
    const CIDADES_BAIRROS = {
      'Macaé': ['Cavaleiros', 'Imbetiba', 'Centro', 'Novo Cavaleiros', 'Praia Campista', 'Riviera Fluminense', 'Parque Aeroporto', 'Glória', 'Granja dos Cavaleiros', 'Visconde de Araújo'],
      'Rio de Janeiro (Capital)': ['Barra da Tijuca', 'Copacabana', 'Ipanema', 'Centro', 'Botafogo', 'Leblon', 'Tijuca', 'Recreio dos Bandeirantes'],
      'Niterói': ['Icaraí', 'Centro', 'Ingá', 'Santa Rosa', 'Piratininga', 'Itaipu'],
      'Cabo Frio': ['Praia do Forte', 'Passagem', 'Centro', 'Braga', 'São Cristóvão'],
      'Campos dos Goytacazes': ['Pelinca', 'Centro', 'Flamboyant', 'Parque Tamandaré', 'Turf Club'],
      'Petrópolis': ['Itaipava', 'Centro Histórico', 'Valparaíso', 'Corrêas', 'Bingen']
    };

    const COMERCIOS_INICIAIS = [
      { id: 'biz-1', name: 'Supermercado Serra-Mar', city: 'Macaé', bairro: 'Cavaleiros', category: 'Mercado / Supermercado', address: 'Av. Atlântica, 1420 - Cavaleiros, Macaé - RJ, 27920-390', phone: '+55 (22) 2772-1010', contactPerson: 'Roberto Silva (Gerente)', status: 'Prospecção', notes: 'Interessado em automação financeira e gestão de estoque.' },
      { id: 'biz-2', name: 'Mac Offshore Energy Supply', city: 'Macaé', bairro: 'Novo Cavaleiros', category: 'Indústria / Offshore', address: 'R. Luiz Carlos de Alencar, 88 - Novo Cavaleiros, Macaé - RJ, 27930-080', phone: '+55 (22) 2772-9090', contactPerson: 'Eng. Carlos Eduardo', status: 'Cliente Ativo', notes: 'Contrato de gestão operacional renovado para 2027.' },
      { id: 'biz-3', name: 'Farmácia & Drogaria Atlântica', city: 'Macaé', bairro: 'Imbetiba', category: 'Farmácia / Saúde', address: 'Av. Elias Agostinho, 210 - Imbetiba, Macaé - RJ, 27913-350', phone: '+55 (22) 2762-3000', contactPerson: 'Dra. Vanessa Lima', status: 'Contatado', notes: 'Aguardando apresentação do painel 4K.' },
      { id: 'biz-4', name: 'Restaurante e Churrascaria Miramar', city: 'Macaé', bairro: 'Praia Campista', category: 'Restaurante / Alimentação', address: 'Av. Geraldo Nogueira da Silva, 450 - Praia Campista, Macaé - RJ', phone: '+55 (22) 2773-5500', contactPerson: 'Chef Marcos', status: 'Prospecção', notes: 'Possui 3 unidades no RJ.' },
      { id: 'biz-5', name: 'Mega Store Eletro & Utilidades', city: 'Macaé', bairro: 'Centro', category: 'Loja / Varejo', address: 'Rua Silva Jardim, 300 - Centro, Macaé - RJ', phone: '+55 (22) 2772-4411', contactPerson: 'Amanda Castro', status: 'Sem Contato', notes: 'Visita agendada para próxima semana.' },
      { id: 'biz-6', name: 'Boutique Icaraí Platinum', city: 'Niterói', bairro: 'Icaraí', category: 'Loja / Varejo', address: 'Rua Ator Paulo Gustavo, 240 - Icaraí, Niterói - RJ', phone: '+55 (21) 2610-9900', contactPerson: 'Luciana Mello', status: 'Cliente Ativo', notes: 'Loja de artigos de luxo.' }
    ];

    function App() {
      const [activeTab, setActiveTab] = useState('radar');
      const [selectedCity, setSelectedCity] = useState('Macaé');
      const [selectedBairro, setSelectedBairro] = useState('Todos');
      
      const [toastMessage, setToastMessage] = useState(null);
      const [isClientPortalGenerated, setIsClientPortalGenerated] = useState(false);
      
      const [businesses, setBusinesses] = useState(COMERCIOS_INICIAIS);
      const [finances, setFinances] = useState([
        { id: 'trx-1', description: 'Licenciamento Sistema Macaé Subsea', amount: 15400.00, type: 'Entrada', category: 'Contrato', city: 'Macaé', date: '2026-10-24' },
        { id: 'trx-2', description: 'Servidor Nuvem 4K & CDN Infra', amount: 1200.00, type: 'Saída', category: 'Infraestrutura', city: 'Rio de Janeiro', date: '2026-10-25' },
        { id: 'trx-3', description: 'Consultoria Empresarial Cavaleiros', amount: 8900.00, type: 'Entrada', category: 'Serviço', city: 'Macaé', date: '2026-10-27' }
      ]);
      const [crmLeads, setCrmLeads] = useState([
        { id: 'lead-1', name: 'Logística Portuária Imbetiba', city: 'Macaé', bairro: 'Imbetiba', value: 450000, stage: 'Negociação Final', rating: 5, responsible: 'Gabriel Santos', phone: '+55 (22) 2772-8833', notes: 'Decisão do conselho agendada.' },
        { id: 'lead-2', name: 'Rede de Hotéis Orla Cavaleiros', city: 'Macaé', bairro: 'Cavaleiros', value: 180000, stage: 'Proposta Enviada', rating: 4, responsible: 'Mariana Costa', phone: '+55 (22) 2772-1122', notes: 'Aguardando validação do setor de TI.' },
        { id: 'lead-3', name: 'Centro Médico Riviera', city: 'Macaé', bairro: 'Riviera Fluminense', value: 95000, stage: 'Qualificado', rating: 3, responsible: 'Gabriel Santos', phone: '+55 (22) 2773-0044', notes: 'Primeira reunião realizada com sucesso.' }
      ]);

      const [radarCategoryFilter, setRadarCategoryFilter] = useState('Todas');
      const [radarSearchTerm, setRadarSearchTerm] = useState('');

      const [activeModal, setActiveModal] = useState(null); // 'add_biz', 'edit_biz', 'add_fin', 'add_lead', 'edit_lead', etc.
      const [modalData, setModalData] = useState({});
      const [itemToDelete, setItemToDelete] = useState(null);

      const [instaPosts, setInstaPosts] = useState([
        { id: 1, likes: 2450, comments: 189, caption: 'Radar de negócios em Macaé expandido! Cobertura completa no bairro Cavaleiros e Imbetiba. ⚡️', time: '2 horas atrás' }
      ]);
      const [newPostCaption, setNewPostCaption] = useState('');

      const [chatMessages, setChatMessages] = useState([
        { sender: 'system', text: 'Central de Suporte Rio Ultra 4K pronta. Como podemos auxiliar nas operações hoje?' }
      ]);
      const [chatInput, setChatInput] = useState('');

      const [systemSettings, setSystemSettings] = useState({
        audioFeedback: true,
        particlesFPS: '60 FPS Ultra',
        whatsappApi: '+552227729000',
        googleMapsKey: 'AIzaSy_RIO_MAPS_4K_VERIFIED',
        autoSave: true
      });

      const canvasRef = useRef(null);

      // Efeito Metal Líquido / Partículas 4K
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        let animationFrameId;

        let width = (canvas.width = window.innerWidth);
        let height = (canvas.height = window.innerHeight);

        const handleResize = () => {
          width = canvas.width = window.innerWidth;
          height = canvas.height = window.innerHeight;
        };
        window.addEventListener('resize', handleResize);

        const particles = Array.from({ length: 45 }, () => ({
          x: Math.random() * width,
          y: Math.random() * height,
          radius: Math.random() * 2 + 0.5,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.4,
          alpha: Math.random() * 0.5 + 0.2
        }));

        const render = () => {
          ctx.clearRect(0, 0, width, height);

          const grad = ctx.createLinearGradient(0, 0, width, height);
          grad.addColorStop(0, 'rgba(15, 23, 42, 0.95)');
          grad.addColorStop(0.5, 'rgba(30, 41, 59, 0.85)');
          grad.addColorStop(1, 'rgba(2, 6, 23, 0.98)');
          ctx.fillStyle = grad;
          ctx.fillRect(0, 0, width, height);

          particles.forEach((p) => {
            p.x += p.vx;
            p.y += p.vy;
            if (p.x < 0 || p.x > width) p.vx *= -1;
            if (p.y < 0 || p.y > height) p.vy *= -1;

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(226, 232, 240, ${p.alpha})`;
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#e2e8f0';
            ctx.fill();
          });

          animationFrameId = requestAnimationFrame(render);
        };

        render();
        return () => {
          window.removeEventListener('resize', handleResize);
          cancelAnimationFrame(animationFrameId);
        };
      }, []);

      const showToast = (msg) => {
        setToastMessage(msg);
        setTimeout(() => setToastMessage(null), 3500);
      };

      const openGoogleMaps = (address, city) => {
        const query = encodeURIComponent(`${address}, ${city}, RJ, Brasil`);
        window.open(`https://www.google.com/maps/search/?api=1&query=${query}`, '_blank');
      };

      // CÁLCULOS FINANCEIROS
      const totalIncome = finances.filter(f => f.type === 'Entrada').reduce((acc, curr) => acc + curr.amount, 0);
      const totalExpenses = finances.filter(f => f.type === 'Saída').reduce((acc, curr) => acc + curr.amount, 0);
      const netBalance = totalIncome - totalExpenses;

      // FILTRAGEM DO RADAR
      const filteredBusinesses = businesses.filter(b => {
        const matchCity = selectedCity === 'Todas' || b.city === selectedCity;
        const matchBairro = selectedBairro === 'Todos' || b.bairro === selectedBairro;
        const matchCategory = radarCategoryFilter === 'Todas' || b.category === radarCategoryFilter;
        const matchSearch = radarSearchTerm === '' || 
          b.name.toLowerCase().includes(radarSearchTerm.toLowerCase()) ||
          b.address.toLowerCase().includes(radarSearchTerm.toLowerCase()) ||
          b.contactPerson.toLowerCase().includes(radarSearchTerm.toLowerCase());
        return matchCity && matchBairro && matchCategory && matchSearch;
      });

      // HANDLERS CRUDS
      const handleSaveBusiness = (e) => {
        e.preventDefault();
        if (modalData.id) {
          setBusinesses(businesses.map(b => b.id === modalData.id ? modalData : b));
          showToast('Empresa/Comércio atualizado com sucesso!');
        } else {
          const newBiz = { ...modalData, id: `biz-${Date.now()}` };
          setBusinesses([newBiz, ...businesses]);
          showToast('Nova empresa adicionada ao Radar do RJ!');
        }
        setActiveModal(null);
      };

      const handleSaveFinance = (e) => {
        e.preventDefault();
        const newFin = {
          id: `trx-${Date.now()}`,
          description: modalData.description,
          amount: parseFloat(modalData.amount) || 0,
          type: modalData.type || 'Entrada',
          category: modalData.category || 'Geral',
          city: modalData.city || 'Macaé',
          date: new Date().toISOString().split('T')[0]
        };
        setFinances([newFin, ...finances]);
        showToast('Lançamento financeiro registrado!');
        setActiveModal(null);
      };

      const handleSaveLead = (e) => {
        e.preventDefault();
        if (modalData.id) {
          setCrmLeads(crmLeads.map(l => l.id === modalData.id ? modalData : l));
          showToast('Negociação de venda atualizada!');
        } else {
          const newLead = {
            ...modalData,
            id: `lead-${Date.now()}`,
            value: parseFloat(modalData.value) || 0,
            rating: parseInt(modalData.rating) || 5
          };
          setCrmLeads([newLead, ...crmLeads]);
          showToast('Novo Lead cadastrado na Gestão de Vendas!');
        }
        setActiveModal(null);
      };

      const confirmDelete = () => {
        if (!itemToDelete) return;
        if (itemToDelete.type === 'business') {
          setBusinesses(businesses.filter(b => b.id !== itemToDelete.id));
          showToast('Empresa removida do cadastro.');
        } else if (itemToDelete.type === 'finance') {
          setFinances(finances.filter(f => f.id !== itemToDelete.id));
          showToast('Transação removida com sucesso.');
        } else if (itemToDelete.type === 'lead') {
          setCrmLeads(crmLeads.filter(l => l.id !== itemToDelete.id));
          showToast('Negociação excluída.');
        }
        setItemToDelete(null);
      };

      return (
        <div className="relative min-h-screen flex flex-col md:flex-row overflow-hidden">
          {/* Canvas Fundo 4K */}
          <canvas ref={canvasRef} className="fixed inset-0 pointer-events-none z-0" />

          {/* NOTIFICAÇÃO TOAST */}
          {toastMessage && (
            <div className="fixed top-6 right-6 z-50 chrome-card px-6 py-4 rounded-xl shadow-2xl border-l-4 border-slate-100 text-slate-100 flex items-center gap-3 animate-bounce">
              <i data-lucide="check-circle-2" className="text-emerald-400 w-6 h-6"></i>
              <span className="font-semibold text-sm tracking-wide">{toastMessage}</span>
            </div>
          )}

          {/* BARRA LATERAL METÁLICA ELEGANTE */}
          <aside className="w-full md:w-80 chrome-card z-20 flex flex-col justify-between border-r border-slate-700/50 p-5 shadow-2xl">
            <div>
              {/* LOGO EMPRESARIAL */}
              <div className="flex items-center gap-3 pb-6 mb-6 border-b border-slate-700/60">
                <div className="p-3 bg-gradient-to-tr from-slate-200 to-slate-400 rounded-2xl shadow-lg text-slate-950 font-black tracking-wider text-xl">
                  4K
                </div>
                <div>
                  <h1 className="font-extrabold text-lg silver-gradient-text tracking-wider uppercase">Rio Subsea</h1>
                  <p className="text-xs text-slate-400 flex items-center gap-1 font-medium">
                    <span className="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
                    Macaé & Região RJ
                  </p>
                </div>
              </div>

              {/* SELETOR DE MUNICÍPIO & BAIRROS */}
              <div className="mb-6 p-3 rounded-xl bg-slate-900/60 border border-slate-800">
                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mb-1">
                  Mapeamento por Município
                </label>
                <select 
                  value={selectedCity} 
                  onChange={(e) => {
                    setSelectedCity(e.target.value);
                    setSelectedBairro('Todos');
                  }}
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-semibold text-slate-200 focus:outline-none focus:border-slate-300"
                >
                  {Object.keys(CIDADES_BAIRROS).map(cidade => (
                    <option key={cidade} value={cidade}>{cidade}</option>
                  ))}
                </select>

                <label className="text-[11px] font-bold text-slate-400 uppercase tracking-wider block mt-3 mb-1">
                  Bairro Específico
                </label>
                <select 
                  value={selectedBairro} 
                  onChange={(e) => setSelectedBairro(e.target.value)}
                  className="w-full bg-slate-950 border border-slate-700 rounded-lg px-3 py-2 text-xs font-semibold text-slate-200 focus:outline-none focus:border-slate-300"
                >
                  <option value="Todos">Todos os Bairros</option>
                  {CIDADES_BAIRROS[selectedCity]?.map(bairro => (
                    <option key={bairro} value={bairro}>{bairro}</option>
                  ))}
                </select>
              </div>

              {/* MENU DE NAVEGAÇÃO PRINCIPAL */}
              <nav className="space-y-2">
                {[
                  { id: 'radar', label: 'Radar Comercial RJ', icon: 'map-pin' },
                  { id: 'finance', label: 'Painel Financeiro', icon: 'dollar-sign' },
                  { id: 'sales', label: 'CRM & Gestão Vendas', icon: 'trending-up' },
                  { id: 'instagram', label: 'Instagram Suite', icon: 'instagram' },
                  { id: 'settings', label: 'Configurações', icon: 'settings' },
                  { id: 'support', label: 'Atendimento VIP 24/7', icon: 'headphones' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => setActiveTab(item.id)}
                    className={`w-full flex items-center justify-between px-4 py-3 rounded-xl text-sm font-semibold transition-all duration-300 ${
                      activeTab === item.id 
                        ? 'bg-gradient-to-r from-slate-100 to-slate-300 text-slate-950 shadow-lg scale-105 font-bold' 
                        : 'text-slate-300 hover:bg-slate-800/60 hover:text-white'
                    }`}
                  >
                    <div className="flex items-center gap-3">
                      <i data-lucide={item.icon} className="w-5 h-5"></i>
                      <span>{item.label}</span>
                    </div>
                  </button>
                ))}
              </nav>
            </div>

            {/* BOTÃO MASTER: GERAR PORTAL DO CLIENTE */}
            <div className="pt-6 border-t border-slate-800">
              <button
                onClick={() => {
                  setIsClientPortalGenerated(true);
                  showToast('Sistema Portal do Cliente 360° gerado com sucesso!');
                }}
                className="w-full py-3.5 px-4 rounded-xl bg-gradient-to-r from-slate-200 via-white to-slate-300 text-slate-950 font-black text-xs uppercase tracking-widest shadow-xl hover:shadow-2xl hover:scale-[1.02] transition-all duration-300 border border-white flex items-center justify-center gap-2"
              >
                <i data-lucide="zap" className="w-4 h-4 fill-slate-950"></i>
                Gerar Sistema Cliente
              </button>
            </div>
          </aside>

          {/* CONTEÚDO PRINCIPAL DO PAINEL */}
          <main className="flex-1 z-10 p-4 md:p-8 overflow-y-auto max-h-screen custom-scrollbar">
            
            {/* CABEÇALHO SUPERIOR */}
            <header className="chrome-card rounded-2xl p-5 mb-8 flex flex-col md:flex-row items-center justify-between gap-4">
              <div>
                <h2 className="text-2xl font-black silver-gradient-text tracking-wide uppercase">
                  {activeTab === 'radar' && 'Mapeamento Comercial & Empresas RJ'}
                  {activeTab === 'finance' && 'Painel de Controle Financeiro'}
                  {activeTab === 'sales' && 'Gestão de Vendas & Negociações'}
                  {activeTab === 'instagram' && 'Instagram & Redes Sociais'}
                  {activeTab === 'settings' && 'Configurações Avançadas do Sistema'}
                  {activeTab === 'support' && 'Central de Suporte Operacional'}
                </h2>
                <p className="text-xs text-slate-400 mt-1">
                  Localização Ativa: <span className="text-slate-200 font-bold">{selectedCity}</span> 
                  {selectedBairro !== 'Todos' && ` → Bairro ${selectedBairro}`}
                </p>
              </div>

              <div className="flex items-center gap-3">
                <div className="px-4 py-2 rounded-xl bg-slate-900/80 border border-slate-700 text-xs font-mono text-slate-300">
                  <span className="text-emerald-400 font-bold">● ONLINE</span> | 4K Ultra Performance
                </div>
              </div>
            </header>

            {/* TAB 1: RADAR COMERCIAL RJ */}
            {activeTab === 'radar' && (
              <div className="space-y-6">
                {/* BARRA DE PESQUISA E AÇÕES */}
                <div className="chrome-card p-5 rounded-2xl flex flex-col lg:flex-row gap-4 items-center justify-between">
                  <div className="flex flex-1 gap-3 w-full">
                    <input 
                      type="text" 
                      placeholder="Buscar por empresa, comércio, mercado, endereço em Macaé/RJ..." 
                      value={radarSearchTerm}
                      onChange={(e) => setRadarSearchTerm(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-slate-200 focus:outline-none focus:border-slate-300"
                    />
                    <select
                      value={radarCategoryFilter}
                      onChange={(e) => setRadarCategoryFilter(e.target.value)}
                      className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none"
                    >
                      <option value="Todas">Todas Categoria</option>
                      <option value="Mercado / Supermercado">Mercado / Supermercado</option>
                      <option value="Indústria / Offshore">Indústria / Offshore</option>
                      <option value="Farmácia / Saúde">Farmácia / Saúde</option>
                      <option value="Restaurante / Alimentação">Restaurante / Alimentação</option>
                      <option value="Loja / Varejo">Loja / Varejo</option>
                    </select>
                  </div>
                  <button
                    onClick={() => {
                      setModalData({ name: '', city: selectedCity, bairro: selectedBairro !== 'Todos' ? selectedBairro : 'Cavaleiros', category: 'Mercado / Supermercado', address: '', phone: '', contactPerson: '', status: 'Prospecção', notes: '' });
                      setActiveModal('add_biz');
                    }}
                    className="w-full lg:w-auto px-5 py-2.5 rounded-xl bg-slate-100 text-slate-950 font-bold text-xs uppercase tracking-wider hover:bg-white transition flex items-center justify-center gap-2 shadow-lg"
                  >
                    <i data-lucide="plus-circle" className="w-4 h-4"></i>
                    Cadastrar Empresa / Comércio
                  </button>
                </div>

                {/* LISTAGEM DE EMPRESAS NO RADAR */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  {filteredBusinesses.map(biz => (
                    <div key={biz.id} className="chrome-card p-6 rounded-2xl flex flex-col justify-between hover:scale-[1.01] transition duration-300">
                      <div>
                        <div className="flex items-start justify-between gap-2 mb-3">
                          <span className="px-2.5 py-1 rounded-full text-[10px] font-black uppercase tracking-wider bg-slate-800 text-slate-300 border border-slate-700">
                            {biz.category}
                          </span>
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                            biz.status === 'Cliente Ativo' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800' : 'bg-amber-950 text-amber-400 border border-amber-800'
                          }`}>
                            {biz.status}
                          </span>

                        value={modalData.contactPerson || ''} 
                        onChange={(e) => setModalData({ ...modalData, contactPerson: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200"
                      />
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-slate-100 text-slate-950 font-bold">Salvar Dados</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ADICIONAR LANÇAMENTO FINANCEIRO */}
          {activeModal === 'add_fin' && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="chrome-card w-full max-w-md p-6 rounded-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-100 uppercase tracking-wider">Novo Lançamento Financeiro</h3>
                <form onSubmit={handleSaveFinance} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Descrição</label>
                    <input 
                      type="text" required 
                      value={modalData.description || ''} 
                      onChange={(e) => setModalData({ ...modalData, description: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Valor (R$)</label>
                      <input 
                        type="number" step="0.01" required 
                        value={modalData.amount || ''} 
                        onChange={(e) => setModalData({ ...modalData, amount: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Tipo</label>
                      <select 
                        value={modalData.type || 'Entrada'} 
                        onChange={(e) => setModalData({ ...modalData, type: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200"
                      >
                        <option value="Entrada">Entrada (+)</option>
                        <option value="Saída">Saída (-)</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-slate-100 text-slate-950 font-bold">Confirmar</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* MODAL ADICIONAR/EDITAR LEAD DE VENDAS */}
          {(activeModal === 'add_lead' || activeModal === 'edit_lead') && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="chrome-card w-full max-w-lg p-6 rounded-2xl space-y-4">
                <h3 className="text-lg font-bold text-slate-100 uppercase tracking-wider">
                  {activeModal === 'add_lead' ? 'Adicionar Novo Lead de Vendas' : 'Editar Lead de Vendas'}
                </h3>
                <form onSubmit={handleSaveLead} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Nome da Empresa / Cliente</label>
                    <input 
                      type="text" required 
                      value={modalData.name || ''} 
                      onChange={(e) => setModalData({ ...modalData, name: e.target.value })}
                      className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Valor Estimado (R$)</label>
                      <input 
                        type="number" required 
                        value={modalData.value || ''} 
                        onChange={(e) => setModalData({ ...modalData, value: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200"
                      />
                    </div>
                    <div>
                      <label className="block text-slate-400 font-bold mb-1">Avaliação (1 a 5 Estrelas)</label>
                      <select 
                        value={modalData.rating || 5} 
                        onChange={(e) => setModalData({ ...modalData, rating: e.target.value })}
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-slate-200"
                      >
                        <option value={5}>5 Estrelas - Altíssimo Potencial</option>
                        <option value={4}>4 Estrelas - Alto Potencial</option>
                        <option value={3}>3 Estrelas - Médio Potencial</option>
                        <option value={2}>2 Estrelas - Baixo Potencial</option>
                        <option value={1}>1 Estrela - Inicial</option>
                      </select>
                    </div>
                  </div>
                  <div className="flex justify-end gap-2 pt-4">
                    <button type="button" onClick={() => setActiveModal(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold">Cancelar</button>
                    <button type="submit" className="px-5 py-2 rounded-xl bg-slate-100 text-slate-950 font-bold">Salvar Lead</button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* CONFIRMAÇÃO DE EXCLUSÃO */}
          {itemToDelete && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
              <div className="chrome-card w-full max-w-sm p-6 rounded-2xl space-y-4 text-center">
                <i data-lucide="alert-triangle" className="w-12 h-12 text-red-400 mx-auto"></i>
                <h3 className="text-lg font-bold text-slate-100">Confirmar Exclusão?</h3>
                <p className="text-xs text-slate-300">
                  Tem certeza que deseja remover <strong>"{itemToDelete.name}"</strong>? Esta ação não pode ser desfeita.
                </p>
                <div className="flex justify-center gap-3 pt-2">
                  <button onClick={() => setItemToDelete(null)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 font-bold text-xs">Cancelar</button>
                  <button onClick={confirmDelete} className="px-5 py-2 rounded-xl bg-red-600 text-white font-bold text-xs">Sim, Excluir</button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    // Inicializador de Ícones Lucide
    setTimeout(() => {
      if (window.lucide) window.lucide.createIcons();
    }, 500);
  </script>
</body>
</html>
